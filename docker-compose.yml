services:
  postgres:
    image: postgres:16-alpine
    container_name: fyde_postgres
    restart: always
    environment:
      POSTGRES_USER: fydeuser
      POSTGRES_PASSWORD: fydepass
      POSTGRES_DB: fydejarvis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fydeuser -d fydejarvis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
